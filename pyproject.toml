[project]
name = "arcana"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiogram>=3,<4", "SQLAlchemy[asyncio]>=2,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2", "pydantic>=2,<3", "pydantic-settings>=2,<3", "httpx>=0.28,<1", "PyYAML>=6,<7", "tzdata"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires a disposable TEST_DATABASE_URL PostgreSQL database"]
